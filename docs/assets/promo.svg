<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="promo-title promo-description">
  <title id="promo-title">Jev Account Filter — 视频平台账户筛选</title>
  <desc id="promo-description">项目介绍与 UGC 数据采集流程。Jev Account Filter 通过视频标题与封面筛选账户，解决人工筛选相关账户的瓶颈。</desc>
