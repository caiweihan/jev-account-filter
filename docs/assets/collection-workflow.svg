<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title description">
  <title id="title">从 UGC 社区到训练数据集</title>
  <desc id="description">UGC 用户创作社区 → 发现候选账户 → 筛选相关账户 → 筛选与审核具体视频 → 构建训练数据集。下方的 Jev Account Filter 通过向上箭头指向筛选相关账户这一步。</desc>
  <rect x="1" y="1" width="1278" height="388" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="24" y="42" font-size="23" font-weight="600" fill="#334155">从 UGC 社区到训练数据集</text>
    <text x="636" y="82" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#4f46e5">账户筛选瓶颈</text>
    <rect x="24" y="100" width="224" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="136" y="143" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">UGC</text><text x="136" y="176" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">用户创作社区</text><path d="M253 152h16m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="100" width="224" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="386" y="143" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">发现</text><text x="386" y="176" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">候选账户</text><path d="M503 152h16m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="524" y="100" width="224" height="104" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="636" y="143" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">筛选</text><text x="636" y="176" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">相关账户</text><path d="M753 152h16m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="774" y="100" width="224" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="886" y="143" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">筛选与审核</text><text x="886" y="176" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">具体视频</text><path d="M1003 152h16m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1024" y="100" width="224" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="1136" y="143" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">构建</text><text x="1136" y="176" text-anchor="middle" font-size="24" font-weight="600" fill="#172554">训练数据集</text>
    <path d="M636 282V222m-9 10 9-10 9 10" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="493" y="292" width="286" height="76" rx="14" fill="#4f46e5"/>
    <text x="636" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Jev Account Filter</text>
    <text x="636" y="350" text-anchor="middle" font-size="18" fill="#e0e7ff">视频标题 + 封面图</text>
  </g>
</svg>
