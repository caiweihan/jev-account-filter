<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title description">
  <title id="title">UGC dataset collection workflow</title>
  <desc id="description">Discover candidate accounts via keywords and recommendations → manually screen relevant accounts (account-screening bottleneck) → select videos with video models and human review → preprocess and build the training dataset. Below, Jev Account Filter screens accounts via titles and thumbnails, with an upward arrow pointing to manual account screening.</desc>
  <rect x="1" y="1" width="1278" height="388" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="24" y="42" font-size="23" font-weight="600" fill="#334155">UGC dataset collection workflow</text>
    <text x="483" y="82" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#4f46e5">ACCOUNT-SCREENING BOTTLENECK</text>
    <rect x="24" y="100" width="290" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="169" y="133" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">Discover candidate accounts</text>
    <text x="169" y="162" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">via keywords and</text>
    <text x="169" y="191" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">recommendations</text>
    <path d="M319 156h14m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="338" y="100" width="290" height="112" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="483" y="147" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">Manually screen</text>
    <text x="483" y="180" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">relevant accounts</text>
    <path d="M633 156h14m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="652" y="100" width="290" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="797" y="133" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">Select videos with</text>
    <text x="797" y="162" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">video models and</text>
    <text x="797" y="191" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">human review</text>
    <path d="M947 156h14m-6-6 6 6-6 6" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="966" y="100" width="290" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1111" y="147" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">Preprocess and build</text>
    <text x="1111" y="180" text-anchor="middle" font-size="21" font-weight="600" fill="#172554">the training dataset</text>
    <path d="M483 282V230m-9 10 9-10 9 10" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="283" y="292" width="400" height="76" rx="14" fill="#4f46e5"/>
    <text x="483" y="324" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Jev Account Filter</text>
    <text x="483" y="350" text-anchor="middle" font-size="18" fill="#e0e7ff">Screen accounts via titles and thumbnails</text>
  </g>
</svg>
