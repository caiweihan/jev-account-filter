<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="902" viewBox="0 0 1440 902" role="img" aria-labelledby="title description">
<title id="title">From account collection to prompt iteration</title><desc id="description">Four rounded boxes contain only numbers, headings and pictograms, with explanatory text on the right. Collect accounts, rank video titles, classify accounts, then analyze and refine. A left-side arrow returns from the last step to the second.</desc>
<defs>
<marker id="down" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#94a3b8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="back" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#b76c18" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="flow-0" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#345bd3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="flow-1" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#7250b8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="flow-2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#118579" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="flow-3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 10 6 2 10" fill="none" stroke="#b76c18" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><g font-family="Segoe UI, Microsoft YaHei, sans-serif">
<path d="M128 795.0H82Q62 795.0 62 775.0V350.0Q62 330.0 82 330.0H124" fill="none" stroke="#b76c18" stroke-width="2.8" marker-end="url(#back)"/>
<text x="34" y="562.5" font-size="18" fill="#b76c18" transform="rotate(-90 34 562.5)" font-weight="600" text-anchor="middle">Reuse data · Iterate prompts</text>
<g class="method-step" data-step="1" transform="translate(128 24)">
<rect width="460" height="166" rx="20" fill="#f0f5ff" stroke="#c9d8fb" stroke-width="1.5"/>
<rect x="22" y="18" width="42" height="34" rx="10" fill="#345bd3"/>
<text x="43" y="42" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">01</text>
<text x="80" y="44" font-size="26" fill="#345bd3" font-weight="700">Collect accounts</text>
<g class="pictograms" transform="translate(0 0)">
<g transform="translate(88 78)" fill="none" stroke="#345bd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="24" r="21"/><path d="m44 40 22 22"/><circle cx="28" cy="21" r="6"/><path d="M17 36q11-13 22 0"/></g><path d="M181 112h77" fill="none" stroke="#345bd3" stroke-width="2.8" marker-end="url(#flow-0)"/><g transform="translate(294 74)" fill="none" stroke="#345bd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="0" width="54" height="63" rx="8" opacity=".3"/><rect x="0" y="8" width="54" height="63" rx="8" fill="#fff"/><circle cx="27" cy="29" r="8"/><path d="M13 52q14-17 28 0M16 62h22"/></g>
</g>
</g>
<g class="explanation" data-step="1" transform="translate(636 24)">
<text x="0" y="43" font-size="23" fill="#20334e" font-weight="600">Account URLs → Profile + first-page videos</text>
<text x="0" y="91" font-size="21" fill="#5c6c82">Save names, bios, titles, URLs and thumbnails.</text>
<text x="0" y="122" font-size="21" fill="#5c6c82">Exclude image posts and other non-video works.</text>
</g>
<path d="M358.0 198V230" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#down)"/>
<g class="method-step" data-step="2" transform="translate(128 238)">
<rect width="460" height="184" rx="20" fill="#f5f1ff" stroke="#dacdf4" stroke-width="1.5"/>
<rect x="22" y="18" width="42" height="34" rx="10" fill="#7250b8"/>
<text x="43" y="42" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">02</text>
<text x="80" y="44" font-size="26" fill="#7250b8" font-weight="700">Select by title</text>
<g class="pictograms" transform="translate(0 4)">
<text x="112" y="79" font-size="18" fill="#7250b8" font-weight="600" text-anchor="middle">All video titles</text><text x="350" y="79" font-size="21" fill="#7250b8" font-weight="700" text-anchor="middle">Top-N</text><g transform="translate(35 88)" fill="none" stroke="#7250b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="154" height="64" rx="8" fill="#fff"/><rect x="10" y="8" width="16" height="11" rx="2"/><path d="m16 10 5 3-5 3Z" stroke-width="1.5"/><path d="M38 14h96"/><rect x="10" y="25" width="16" height="11" rx="2"/><path d="m16 27 5 3-5 3Z" stroke-width="1.5"/><path d="M38 31h96"/><rect x="10" y="42" width="16" height="11" rx="2"/><path d="m16 44 5 3-5 3Z" stroke-width="1.5"/><path d="M38 48h96"/></g><g transform="translate(285 88)" fill="none" stroke="#7250b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="130" height="64" rx="8" fill="#fff"/><path d="m10 14 5 5 8-10M35 14h80"/><path d="m10 35 5 5 8-10M35 35h80"/><path d="M35 54h10m10 0h10m10 0h10" opacity=".35"/></g><path d="M205 120h61" fill="none" stroke="#7250b8" stroke-width="2.8" marker-end="url(#flow-1)"/>
</g>
</g>
<g class="explanation" data-step="2" transform="translate(636 238)">
<text x="0" y="43" font-size="23" fill="#20334e" font-weight="600">Pass 1: All video titles → Top-N candidates</text>
<text x="0" y="91" font-size="21" fill="#5c6c82">Titles only: no account name, biography or images.</text>
<text x="0" y="122" font-size="21" fill="#5c6c82">Default N = 5; adjustable.</text>
</g>
<path d="M358.0 430V462" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#down)"/>
<g class="method-step" data-step="3" transform="translate(128 470)">
<rect width="460" height="194" rx="20" fill="#eef9f6" stroke="#bee6dd" stroke-width="1.5"/>
<rect x="22" y="18" width="42" height="34" rx="10" fill="#118579"/>
<text x="43" y="42" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">03</text>
<text x="80" y="44" font-size="26" fill="#118579" font-weight="700">Classify accounts</text>
<g class="pictograms" transform="translate(0 4)">
<text x="81" y="79" font-size="17" fill="#118579" font-weight="600" text-anchor="middle">Account profile</text><text x="237" y="79" font-size="18" fill="#118579" font-weight="700" text-anchor="middle">Top-N videos</text><g transform="translate(22 90)" fill="none" stroke="#118579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="118" height="58" rx="7" fill="#fff"/><circle cx="18" cy="18" r="7"/><path d="M9 32q9-12 18 0"/></g><text x="61" y="114" font-size="17" fill="#118579" font-weight="600">Name</text><text x="35" y="139" font-size="17" fill="#118579" font-weight="600">Bio</text><path d="M89 135h37" stroke="#118579" stroke-width="2" opacity=".5"/><text x="157" y="124" font-size="25" fill="#118579" font-weight="600" text-anchor="middle">+</text><g transform="translate(177 92)" fill="none" stroke="#118579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="-5" width="112" height="55" rx="6" opacity=".35"/><rect width="112" height="55" rx="6" fill="#fff"/><rect x="7" y="7" width="35" height="26" rx="3"/><circle cx="16" cy="15" r="3"/><path d="m10 29 10-10 9 7 7-6M51 13h52M51 25h44M9 43h92" stroke-width="2"/></g><text x="237" y="173" font-size="16" fill="#118579" font-weight="600" text-anchor="middle">Titles + covers</text><path d="M309 119h39" fill="none" stroke="#118579" stroke-width="2.8" marker-end="url(#flow-2)"/><g transform="translate(356 80)" fill="none" stroke="#118579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="32" r="21" fill="#fff"/><path d="m11 31 7 8 14-16"/><circle cx="65" cy="53" r="15" fill="#fff" opacity=".65"/><path d="m60 48 10 10m0-10-10 10"/></g>
</g>
</g>
<g class="explanation" data-step="3" transform="translate(636 470)">
<text x="0" y="43" font-size="23" fill="#20334e" font-weight="600">Pass 2: Name + bio + Top-N video titles and thumbnails</text>
<text x="0" y="74" font-size="23" fill="#20334e" font-weight="600">→ Account category, account probability and video scores</text>
<text x="0" y="105" font-size="21" fill="#5c6c82">The model judges the account category independently;</text>
<text x="0" y="136" font-size="21" fill="#5c6c82">a video-score threshold does not replace this decision.</text>
</g>
<path d="M358.0 672V704" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#down)"/>
<g class="method-step" data-step="4" transform="translate(128 712)">
<rect width="460" height="166" rx="20" fill="#fff7ed" stroke="#f1d8b8" stroke-width="1.5"/>
<rect x="22" y="18" width="42" height="34" rx="10" fill="#b76c18"/>
<text x="43" y="42" font-size="20" fill="#fff" font-weight="700" text-anchor="middle">04</text>
<text x="80" y="44" font-size="26" fill="#b76c18" font-weight="700">Analyze &amp; refine</text>
<g class="pictograms" transform="translate(0 0)">
<g transform="translate(88 78)" fill="none" stroke="#b76c18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0v66h76"/><rect x="12" y="36" width="12" height="22" rx="2" fill="#fff"/><rect x="34" y="19" width="12" height="39" rx="2" fill="#fff"/><rect x="56" y="5" width="12" height="53" rx="2" fill="#fff"/></g><path d="M181 112h77" fill="none" stroke="#b76c18" stroke-width="2.8" marker-end="url(#flow-3)"/><g transform="translate(294 74)" fill="none" stroke="#b76c18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M45 0H7a7 7 0 0 0-7 7v51a7 7 0 0 0 7 7h47a7 7 0 0 0 7-7V16Z" fill="#fff"/><path d="M44 0v17h17M12 20h20M12 33h30M12 46h18"/><path d="m39 53 22-22 9 9-22 22-13 4Z" fill="#fff"/></g>
</g>
</g>
<g class="explanation" data-step="4" transform="translate(636 712)">
<text x="0" y="43" font-size="23" fill="#20334e" font-weight="600">Distributions + clusters → Review evidence → Refine prompt</text>
<text x="0" y="91" font-size="21" fill="#5c6c82">Return to pass 1 with the same local dataset.</text>
<text x="0" y="122" font-size="21" fill="#5c6c82">No new visits to the video platform.</text>
</g>
</g></svg>
