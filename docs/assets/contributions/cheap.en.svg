<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
  <title id="title">Cheap: Make large-scale screening affordable</title>
  <desc id="description">The decision API has a standard input price of $0.10 per million tokens, with no output-token charge. [5] Rank titles first, then send the top N thumbnails to assess accounts and videos with compact inputs. Reuse cached evidence to test rules without collecting again.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1L6 4L1 7" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g class="contribution" data-kind="Cheap" transform="translate(4,4)">
      <rect x="0" y="0" width="1432" height="405" rx="26" fill="#effaf5" stroke="#c5e8d7" stroke-width="1.5" />
      <g class="copy">
