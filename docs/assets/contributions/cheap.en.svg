        <text x="26" y="82" font-size="18" fill="#64748b">/ 1M input tokens [5]</text>
        <rect x="324" y="25" width="160" height="62" rx="16" fill="#c5e8d7" stroke="none" />
        <text x="404" y="51" font-size="16" fill="#087a55" text-anchor="middle">Output charge</text>
        <text x="404" y="76" font-size="25" fill="#087a55" font-weight="700" text-anchor="middle">$0</text>
