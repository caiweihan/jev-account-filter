<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Cheap: Low-cost decisions at dataset scale</title><desc id="description">Decision models make large-scale screening inexpensive. Rank titles first, then send only the top N thumbnails. Reuse the same evidence for several decision questions. Repeat experiments with the collected data, without collecting the same accounts again.</desc>
