        <text x="390" y="217" font-size="18" fill="#087a55" font-weight="600" text-anchor="middle">Selected images</text>
        <text x="255" y="268" font-size="17" fill="#64748b" text-anchor="middle">Rank text first. Send only selected images.</text>
      </g>
    </g>
  </g>
