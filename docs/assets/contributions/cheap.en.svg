<text x="57" y="65" font-size="38" fill="#087a55" font-weight="700">Cheap</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">Low-cost decisions at dataset scale</text>
<text x="38" y="158" font-size="24" fill="#43516a">Decision models make large-scale screening inexpensive.</text><text x="38" y="193" font-size="24" fill="#43516a">Rank titles first, then send only the top N thumbnails.</text><text x="38" y="228" font-size="24" fill="#43516a">Reuse the same evidence for several decision questions.</text><text x="38" y="263" font-size="24" fill="#43516a">Repeat experiments with the collected data,</text><text x="38" y="298" font-size="24" fill="#43516a">without collecting the same accounts again.</text></g>
