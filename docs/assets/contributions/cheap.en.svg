        <text x="57" y="65" font-size="38" fill="#087a55" font-weight="700">Cheap</text>
        <text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">Make large-scale screening affordable</text>
        <text x="38" y="155" font-size="25" fill="#43516a">The decision API has a standard input price of $0.10 per million</text>
        <text x="38" y="190" font-size="25" fill="#43516a">tokens, with no output-token charge. [5] Rank titles first, then send</text>
        <text x="38" y="225" font-size="25" fill="#43516a">the top N thumbnails to assess accounts and videos with compact</text>
        <text x="38" y="260" font-size="25" fill="#43516a">inputs. Reuse cached evidence to test rules without collecting again.</text>
      </g>
      <text x="1396" y="32" font-size="17" fill="#087a55" opacity=".55" font-weight="600" text-anchor="end">02</text>
      <path d="M843 43V362" fill="none" stroke="#c5e8d7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <g class="artwork" transform="translate(876,62.5)">
