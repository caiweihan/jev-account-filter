<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
  <title id="title">Flexible: 让筛选规则可以反复试验</title>
  <desc id="description">类别边界、账户类型与证据要求，都可以通过配置反复调整和比较。复用同一份数据重新实验，减少人工规则变化后的重复审阅，让筛选标准跟着研究问题迭代。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1L6 4L1 7" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g class="contribution" data-kind="Flexible" transform="translate(4,4)">
      <rect x="0" y="0" width="1432" height="405" rx="26" fill="#fff7ed" stroke="#f3ddbb" stroke-width="1.5" />
      <g class="copy">
        <rect x="38" y="35" width="5" height="37" rx="2.5" fill="#ad5b16" stroke="none" />
        <text x="57" y="65" font-size="38" fill="#ad5b16" font-weight="700">Flexible</text>
        <text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">让筛选规则可以反复试验</text>
        <text x="38" y="155" font-size="25" fill="#43516a">类别边界、账户类型与证据要求，都可以通过配置反复调整和比较。</text>
        <text x="38" y="190" font-size="25" fill="#43516a">复用同一份数据重新实验，减少人工规则变化后的重复审阅，让筛选</text>
        <text x="38" y="225" font-size="25" fill="#43516a">标准跟着研究问题迭代。</text>
      </g>
      <text x="1396" y="32" font-size="17" fill="#ad5b16" opacity=".55" font-weight="600" text-anchor="end">04</text>
      <path d="M843 43V362" fill="none" stroke="#f3ddbb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <g class="artwork" transform="translate(876,62.5)">
        <rect x="0" y="0" width="510" height="280" rx="22" fill="#ffffff" stroke="#f3ddbb" fill-opacity=".76" />
        <text x="25" y="31" font-size="19" fill="#ad5b16" font-weight="600">同一份数据，反复试验规则</text>
        <ellipse cx="90" cy="113" rx="54" ry="17" fill="#f3ddbb" stroke="#ad5b16" stroke-width="2.5" />
        <path d="M36 113V171C36 194 144 194 144 171V113M36 141C36 164 144 164 144 141" fill="none" stroke="#ad5b16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="90" y="222" font-size="17" fill="#ad5b16" font-weight="600" text-anchor="middle">采集资料</text>
        <path d="M145 150H190V80H234" fill="none" stroke="#ad5b16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
        <rect x="239" y="57" width="242" height="45" rx="11" fill="#ffffff" stroke="#f3ddbb" />
        <text x="257" y="85" font-size="17" fill="#24344e" font-weight="600">筛选规则</text>
        <rect x="421" y="66" width="42" height="27" rx="8" fill="#f3ddbb" stroke="none" />
        <text x="442" y="85" font-size="16" fill="#ad5b16" font-weight="600" text-anchor="middle">v1</text>
        <path d="M145 150H190V142H234" fill="none" stroke="#ad5b16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
        <rect x="239" y="119" width="242" height="45" rx="11" fill="#ffffff" stroke="#f3ddbb" />
        <text x="257" y="147" font-size="17" fill="#24344e" font-weight="600">筛选规则</text>
        <rect x="421" y="128" width="42" height="27" rx="8" fill="#f3ddbb" stroke="none" />
        <text x="442" y="147" font-size="16" fill="#ad5b16" font-weight="600" text-anchor="middle">v2</text>
        <path d="M145 150H190V204H234" fill="none" stroke="#ad5b16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
        <rect x="239" y="181" width="242" height="45" rx="11" fill="#ffffff" stroke="#f3ddbb" />
        <text x="257" y="209" font-size="17" fill="#24344e" font-weight="600">筛选规则</text>
        <rect x="421" y="190" width="42" height="27" rx="8" fill="#f3ddbb" stroke="none" />
        <text x="442" y="209" font-size="16" fill="#ad5b16" font-weight="600" text-anchor="middle">v3</text>
        <text x="255" y="267" font-size="17" fill="#64748b" text-anchor="middle">调整 → 重跑 → 比较</text>
      </g>
    </g>
  </g>
</svg>