<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
  <title id="title">Promising: 无需微调，还有更大的提升空间</title>
  <desc id="description">项目未微调模型，在 GPT-6 Luna Decisions 于 2026-10-06 发布约一周内开始构建与验证。 这是决策模型用于领域数据集采集的早期探索。随着模型视觉理解与决策能力提升，同一套流程有望获得更好的筛选质量，并扩展到更多研究领域与视频平台。</desc>
