<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Cheap: 让大规模账户筛选更便宜</title><desc id="description">决策模型让大规模账户筛选保持低成本。 先按标题初筛，再输入前 N 张候选封面， 减少图像输入，让多个决策问题共享同一份证据。 重复实验直接复用已采集数据， 无需反复访问平台、下载视频或重新采集。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#087a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><g class="contribution" data-kind="Cheap" transform="translate(4,4)">
<rect width="1432" height="405" rx="26" fill="#effaf5" stroke="#c5e8d7" stroke-width="1.5"/>
<g class="copy"><rect x="38" y="35" width="5" height="37" rx="2.5" fill="#087a55"/>
<text x="57" y="65" font-size="38" fill="#087a55" font-weight="700">Cheap</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">让大规模账户筛选更便宜</text>
<text x="38" y="158" font-size="24" fill="#43516a">决策模型让大规模账户筛选保持低成本。</text><text x="38" y="193" font-size="24" fill="#43516a">先按标题初筛，再输入前 N 张候选封面，</text><text x="38" y="228" font-size="24" fill="#43516a">减少图像输入，让多个决策问题共享同一份证据。</text><text x="38" y="263" font-size="24" fill="#43516a">重复实验直接复用已采集数据，</text><text x="38" y="298" font-size="24" fill="#43516a">无需反复访问平台、下载视频或重新采集。</text></g>
<text x="1396" y="32" font-size="17" fill="#087a55" font-weight="600" text-anchor="end">02</text>
