<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Fast: Screen the same accounts 166.67× faster</title><desc id="description">Screen the same accounts 166.67× faster Human screening: 1,500 person-hours for 2,140 accounts. Our workflow: 8 h of collection + 1 h of Jev API calls. One request answers multiple questions in parallel, sharing titles and thumbnails across account and video judgments, without watching each full video.</desc>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><g class="contribution" data-kind="Fast" transform="translate(4,4)">
<rect width="1432" height="405" rx="26" fill="#eef4ff" stroke="#cadbf6" stroke-width="1.5"/>
<g class="copy"><rect x="38" y="35" width="5" height="37" rx="2.5" fill="#285ad0"/>
<text x="57" y="65" font-size="38" fill="#285ad0" font-weight="700">Fast</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">Screen the same accounts 166.67× faster</text>
<text x="38" y="158" font-size="24" fill="#43516a">Human screening: 1,500 person-hours for 2,140 accounts.</text><text x="38" y="193" font-size="24" fill="#43516a">Our workflow: 8 h of collection + 1 h of Jev API calls.</text><text x="38" y="228" font-size="24" fill="#43516a">One request answers multiple questions in parallel,</text><text x="38" y="263" font-size="24" fill="#43516a">sharing titles and thumbnails across account and video</text><text x="38" y="298" font-size="24" fill="#43516a">judgments, without watching each full video.</text></g>
<text x="1396" y="32" font-size="17" fill="#285ad0" font-weight="600" text-anchor="end">01</text>
<path d="M843 43V362" stroke="#cadbf6" stroke-width="1.2"/>
