  <title id="title">Promising: An early exploration with room to grow</title>
  <desc id="description">Built about a week after GPT-6 Luna Decisions launched, this project explores decision models for domain dataset collection. As visual understanding and decision capabilities improve, the same workflow could deliver better screening across more research domains and video platforms.</desc>
