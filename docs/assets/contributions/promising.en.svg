        <text x="255" y="184" font-size="16" fill="#24344e" font-weight="600" text-anchor="middle">~1 week later</text>
        <text x="429" y="184" font-size="16" fill="#24344e" font-weight="600" text-anchor="middle">Future models</text>
        <text x="82" y="210" font-size="16" fill="#64748b" text-anchor="middle">Model release</text>
        <text x="255" y="210" font-size="16" fill="#64748b" text-anchor="middle">Project validation</text>
        <text x="429" y="210" font-size="16" fill="#64748b" text-anchor="middle">More domains</text>
