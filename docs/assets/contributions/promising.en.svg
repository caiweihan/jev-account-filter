        <text x="25" y="31" font-size="19" fill="#16748c" font-weight="600">Off-the-shelf today. Room to grow.</text>
        <path d="M116 122H217" fill="none" stroke="#16748c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
        <path d="M292 122H390" fill="none" stroke="#16748c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="6 7" />
        <circle cx="82" cy="122" r="34" fill="#c8e4ef" />
        <circle cx="255" cy="122" r="34" fill="#c8e4ef" />
        <circle cx="429" cy="122" r="34" fill="#c8e4ef" />
        <rect x="65" y="106" width="34" height="30" rx="6" fill="#ffffff" stroke="#16748c" />
