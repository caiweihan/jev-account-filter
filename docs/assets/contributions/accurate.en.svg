<title id="title">Accurate: Higher accuracy than the original human labels</title><desc id="description">Higher accuracy than the original human labels On the 2,140-account Douyin evaluation, estimated human accuracy is 94.02%; model accuracy is 96.64%. Re-review resolves all 198 original disagreements; the remaining matching labels are assumed correct. Conditional full-set estimate; not all accounts independently re-reviewed.</desc>
