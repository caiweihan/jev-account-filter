<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Accurate: Evaluate models on real accounts</title><desc id="description">Evaluate models on real accounts On 2,140 Douyin accounts, Jev reaches 94.49% accuracy. GPT-6 Luna Decisions reaches 96.64% on the same set. The original human annotations reach 94.02%. Second-review labels provide the evaluation reference; unreviewed accounts retain their original labels.</desc>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><g class="contribution" data-kind="Accurate" transform="translate(4,4)">
