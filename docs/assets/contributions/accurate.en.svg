<g class="copy"><rect x="38" y="35" width="5" height="37" rx="2.5" fill="#7040b9"/>
<text x="57" y="65" font-size="38" fill="#7040b9" font-weight="700">Accurate</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">Evaluate models on real accounts</text>
<text x="38" y="158" font-size="24" fill="#43516a">On 2,140 Douyin accounts, Jev reaches 94.49% accuracy.</text><text x="38" y="193" font-size="24" fill="#43516a">GPT-6 Luna Decisions reaches 96.64% on the same set.</text><text x="38" y="228" font-size="24" fill="#43516a">The original human annotations reach 94.02%.</text><text x="38" y="263" font-size="24" fill="#43516a">Second-review labels provide the evaluation reference;</text><text x="38" y="298" font-size="24" fill="#43516a">unreviewed accounts retain their original labels.</text></g>
<text x="1396" y="32" font-size="17" fill="#7040b9" font-weight="600" text-anchor="end">03</text>
