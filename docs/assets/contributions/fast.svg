<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Fast: 同一批账户，筛选加速 166.67×</title><desc id="description">同一批账户，筛选加速 166.67× 人工筛选 2140 个账户，共耗时 1500 人时。 本项目用 8 小时采集数据，1 小时调用 Jev API。 一个请求可并行回答多个独立问题，共用标题与封面， 同时判断账户类别与候选视频，无需逐个观看完整视频。 后续调整规则时，可以直接复用采集数据。</desc>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><g class="contribution" data-kind="Fast" transform="translate(4,4)">
<rect width="1432" height="405" rx="26" fill="#eef4ff" stroke="#cadbf6" stroke-width="1.5"/>
<g class="copy"><rect x="38" y="35" width="5" height="37" rx="2.5" fill="#285ad0"/>
<text x="57" y="65" font-size="38" fill="#285ad0" font-weight="700">Fast</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">同一批账户，筛选加速 166.67×</text>
<text x="38" y="158" font-size="24" fill="#43516a">人工筛选 2140 个账户，共耗时 1500 人时。</text><text x="38" y="193" font-size="24" fill="#43516a">本项目用 8 小时采集数据，1 小时调用 Jev API。</text><text x="38" y="228" font-size="24" fill="#43516a">一个请求可并行回答多个独立问题，共用标题与封面，</text><text x="38" y="263" font-size="24" fill="#43516a">同时判断账户类别与候选视频，无需逐个观看完整视频。</text><text x="38" y="298" font-size="24" fill="#43516a">后续调整规则时，可以直接复用采集数据。</text></g>
<text x="1396" y="32" font-size="17" fill="#285ad0" font-weight="600" text-anchor="end">01</text>
<path d="M843 43V362" stroke="#cadbf6" stroke-width="1.2"/>
<g class="artwork" transform="translate(876,62.5)"><rect width="510" height="280" rx="22" fill="#fff" fill-opacity=".8" stroke="#cadbf6"/><text x="25" y="31" font-size="19" fill="#285ad0" font-weight="600">2140 个账户 · 筛选耗时</text><text x="25" y="82" font-size="21" fill="#24344e" font-weight="600">人工筛选</text><text x="485" y="82" font-size="24" fill="#285ad0" font-weight="700" text-anchor="end">1500 小时</text><rect x="25" y="96" width="460" height="22" rx="5" fill="#afc5ef"/><text x="25" y="157" font-size="21" fill="#24344e" font-weight="600">Jev 筛选流程</text><text x="485" y="157" font-size="24" fill="#285ad0" font-weight="700" text-anchor="end">8 + 1 小时</text><rect x="25" y="171" width="2.76" height="22" rx="1" fill="#285ad0"/><text x="25" y="218" font-size="19" fill="#64748b">8 小时采集 + 1 小时 Jev API</text><text x="255" y="259" font-size="29" fill="#285ad0" font-weight="700" text-anchor="middle">加速 166.67×</text></g>
