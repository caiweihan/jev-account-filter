<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="413" viewBox="0 0 1440 413" role="img" aria-labelledby="title description">
<title id="title">Fast: 同一批账户，筛选加速 136.36×</title><desc id="description">同一批账户，筛选加速 136.36× 人工筛选 2140 个账户，共耗时 1500 人时。 模型仅用 11 小时完成同一批账户的筛选。 一个请求可并行回答多个独立问题，共用标题与封面， 同时判断账户类别与候选视频，无需逐个观看完整视频。 人工与模型筛选耗时均采用团队提供的数据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#285ad0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><g class="contribution" data-kind="Fast" transform="translate(4,4)">
<rect width="1432" height="405" rx="26" fill="#eef4ff" stroke="#cadbf6" stroke-width="1.5"/>
<g class="copy"><rect x="38" y="35" width="5" height="37" rx="2.5" fill="#285ad0"/>
<text x="57" y="65" font-size="38" fill="#285ad0" font-weight="700">Fast</text><text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">同一批账户，筛选加速 136.36×</text>
<text x="38" y="158" font-size="24" fill="#43516a">人工筛选 2140 个账户，共耗时 1500 人时。</text><text x="38" y="193" font-size="24" fill="#43516a">模型仅用 11 小时完成同一批账户的筛选。</text><text x="38" y="228" font-size="24" fill="#43516a">一个请求可并行回答多个独立问题，共用标题与封面，</text><text x="38" y="263" font-size="24" fill="#43516a">同时判断账户类别与候选视频，无需逐个观看完整视频。</text>
<text x="38" y="350" font-size="18" fill="#64748b">人工与模型筛选耗时均采用团队提供的数据。</text></g>
<text x="1396" y="32" font-size="17" fill="#285ad0" font-weight="600" text-anchor="end">01</text>
