<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2129" viewBox="0 0 1440 2129" role="img" aria-labelledby="title description">
<title id="title">Five advantages of Jev Account Filter</title>
<desc id="description">Fast: One request answers several independent questions in parallel, sharing titles and thumbnails to judge the account category and multiple candidate videos. The official API is about 10 times faster than the Responses API. [5] No full-video downloading, decoding, or viewing is required. Cheap: The decision API has a standard input price of $0.10 per million tokens, with no output-token charge. [5] Rank titles first, then send the top N thumbnails to assess accounts and videos with compact inputs. Reuse cached evidence to test rules without collecting again. Accurate: Compared with human annotations for 2,140 Douyin accounts: of the 2,136 with explicit binary labels, 1,942 matched, giving 90.92% annotation agreement. Thumbnails and scores remain available for reviewing disagreements. Flexible: Adjust and compare category boundaries, account types, and evidence requirements through configuration. Rerun on the same cache to reduce repeated manual review when rules change, and let the screening criteria evolve with the research question. Promising: No model fine-tuning was used. Development and validation began approximately one week after GPT-6 Luna Decisions was released on October 6, 2026. [6] This is an early exploration of decision models for domain dataset collection. As visual understanding and decision capabilities improve, the same pipeline could deliver better screening and extend to more research domains and video platforms.</desc>
