<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2129" viewBox="0 0 1440 2129" role="img" aria-labelledby="title description">
<title id="title">Jev Account Filter 的五项优点</title>
<desc id="description">Fast: 同一请求可并行回答多个独立问题，共用标题与封面，一次判断账户类别及多个候选视频。官方接口速度约为Responses API 的 10 倍。[5]无需下载、解码或逐个观看完整视频。 Cheap: 决策接口标准输入价格为$0.10 / 百万 tokens，不收输出费用。[5]先用标题筛选，再发送前 N 张封面，以少量输入完成账户与视频判断。数据可复用，规则实验无需重新采集。 Accurate: 与 2140 个抖音账户的人工标注比较，二类标注明确的 2136 个账户中，模型与人工一致 1942 个，标注一致率为 90.92%。保留封面与分数，支持逐项复核差异。 Flexible: 类别边界、账户类型与证据要求，都可以通过配置反复调整和比较。复用同一份数据重新实验，减少人工规则变化后的重复审阅，让筛选标准跟着研究问题迭代。 Promising: 项目未微调模型，在 GPT-6 Luna Decisions 于 2026-10-06 发布约一周内开始构建与验证。[6] 这是决策模型用于领域数据集采集的早期探索。随着模型视觉理解与决策能力提升，同一套流程有望获得更好的筛选质量，并扩展到更多研究领域与视频平台。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L6 4L1 7" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
