<text x="57" y="65" font-size="38" fill="#285ad0" font-weight="700">Fast</text>
<text x="38" y="109" font-size="26" fill="#24344e" font-weight="600">让判断跟上数据的规模</text>
<text x="38" y="155" font-size="25" fill="#43516a">同一请求可并行回答多个独立问题，共用标题与封面，一次判断账户</text>
<text x="38" y="190" font-size="25" fill="#43516a">类别及多个候选视频。官方接口速度约为Responses API 的 10 倍。</text>
<text x="38" y="225" font-size="25" fill="#43516a">[5]无需下载、解码或逐个观看完整视频。</text>
</g>
